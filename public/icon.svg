<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle / Android adaptive shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer document canvas preview -->
  <rect x="76" y="76" width="360" height="360" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" />

  <!-- 3 cols x 2 rows Grid (6 miniature pages) -->
  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <!-- Col 1, Row 1 -->
    <rect x="96" y="96" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="110" y="112" width="50" height="6" rx="3" fill="#6366f1" />
    <rect x="110" y="126" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="110" y="136" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="110" y="146" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="172" cy="212" r="8" fill="#e0e7ff" />
    <text x="172" y="215" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">1</text>

    <!-- Col 2, Row 1 -->
    <rect x="208" y="96" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="222" y="112" width="50" height="6" rx="3" fill="#6366f1" />
    <rect x="222" y="126" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="222" y="136" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="222" y="146" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="284" cy="212" r="8" fill="#e0e7ff" />
    <text x="284" y="215" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">2</text>

    <!-- Col 3, Row 1 -->
    <rect x="320" y="96" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="334" y="112" width="50" height="6" rx="3" fill="#6366f1" />
    <rect x="334" y="126" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="334" y="136" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="334" y="146" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="396" cy="212" r="8" fill="#e0e7ff" />
    <text x="396" y="215" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">3</text>

    <!-- Row 2 -->
    <!-- Col 1, Row 2 -->
    <rect x="96" y="256" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="110" y="272" width="50" height="6" rx="3" fill="#06b6d4" />
    <rect x="110" y="286" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="110" y="296" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="110" y="306" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="172" cy="372" r="8" fill="#e0e7ff" />
    <text x="172" y="375" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">4</text>

    <!-- Col 2, Row 2 -->
    <rect x="208" y="256" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="222" y="272" width="50" height="6" rx="3" fill="#06b6d4" />
    <rect x="222" y="286" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="222" y="296" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="222" y="306" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="284" cy="372" r="8" fill="#e0e7ff" />
    <text x="284" y="375" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">5</text>

    <!-- Col 3, Row 2 -->
    <rect x="320" y="256" width="96" height="136" rx="8" fill="url(#cardGrad)" />
    <rect x="334" y="272" width="50" height="6" rx="3" fill="#06b6d4" />
    <rect x="334" y="286" width="68" height="4" rx="2" fill="#cbd5e1" />
    <rect x="334" y="296" width="60" height="4" rx="2" fill="#cbd5e1" />
    <rect x="334" y="306" width="68" height="4" rx="2" fill="#cbd5e1" />
    <circle cx="396" cy="372" r="8" fill="#e0e7ff" />
    <text x="396" y="375" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4f46e5" text-anchor="middle">6</text>
  </g>

  <!-- Central Badge / 3x2 indicator -->
  <rect x="180" y="440" width="152" height="32" rx="16" fill="#10b981" />
  <text x="256" y="461" font-size="14" font-family="sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">3 × 2 GRID</text>
</svg>
